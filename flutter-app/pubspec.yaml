name: app_recaudo_legal
description: App Recaudo Legal — Gestión de Cobranzas en Campo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  cloud_functions: ^5.3.4
  firebase_storage: ^12.4.7

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  iconsax_flutter: ^1.0.0+1

  # Location / GPS
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Maps (open-source, BSD-3, uses OpenStreetMap tiles — free)
  flutter_map: ^8.2.2
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1

  # Connectivity
  connectivity_plus: ^6.1.4

  # State Management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.70.2

  # Utils
  http: ^1.2.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  share_plus: ^10.1.4
  printing: ^5.14.2
  pdf: ^3.11.3
  image: ^4.5.4
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon.png

flutter:
  uses-material-design: true
